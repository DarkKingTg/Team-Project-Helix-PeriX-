services:
  # -------------------------------------------------------------
  # PeriX Backend API Service (NestJS)
  # -------------------------------------------------------------
  - type: web
    name: perix-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        sync: false
      - key: ML_SERVICE_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: '"PeriX Platform" <no-reply@perix.in>'
      - key: DATA_GOV_IN_API_KEY
        sync: false
      - key: WEATHER_API_KEY
        sync: false

  # -------------------------------------------------------------
  # PeriX 10-Layer AI ML Microservice (FastAPI / Python)
  # -------------------------------------------------------------
  - type: web
    name: perix-ml-service
    runtime: python
    rootDir: ml-service
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: MODEL_DIR
        value: app/trained_models
      - key: DATA_DIR
        value: data
